{% extends "base.html" %}

{% block title %}Iniciar Sesión — Habitaciones huérfanas{% endblock %}

{% block content %}
<main class="max-w-md mx-auto px-4 py-20 flex-grow w-full">
    <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-sm border border-sepia-200 text-center">
        <div
            class="w-16 h-16 bg-sepia-100 rounded-full flex items-center justify-center mx-auto mb-4 text-accent-wine text-2xl">
            <i class="fa-solid fa-feather-pointed"></i>
        </div>

        <h2 class="font-title text-2xl font-bold text-sepia-900 mb-1">Acceso del Autor</h2>
        <p class="text-sepia-700 text-xs mb-6">Ingresa tus credenciales para administrar tus obras.</p>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4 text-left">
            <div>
                <label for="username" class="block text-xs font-semibold text-sepia-800 mb-1">Usuario</label>
                <input type="text" id="username" name="username" required placeholder="admin"
                    class="w-full px-4 py-2.5 rounded-xl border border-sepia-300 focus:border-accent-wine focus:ring-2 focus:ring-accent-wine/20 focus:outline-none text-sm">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-sepia-800 mb-1">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="••••••••"
                    class="w-full px-4 py-2.5 rounded-xl border border-sepia-300 focus:border-accent-wine focus:ring-2 focus:ring-accent-wine/20 focus:outline-none text-sm">
            </div>

            <button type="submit"
                class="w-full py-3 bg-accent-wine hover:bg-sepia-900 text-white font-medium text-sm rounded-xl transition-colors shadow-sm mt-2">
                Iniciar Sesión
            </button>
        </form>
    </div>
</main>
{% endblock %}
