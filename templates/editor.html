{% extends "base.html" %}

{% block title %}{% if work %}Editar Obra{% else %}Nueva Publicación{% endif %} — Susurros de Papel{% endblock %}

{% block content %}
<main class="max-w-3xl mx-auto px-4 py-12 flex-grow w-full">
    <div class="bg-white p-8 md:p-10 rounded-2xl shadow-sm border border-sepia-200">
        <div class="flex items-center space-x-3 mb-6">
            <span class="text-2xl text-accent-wine"><i class="fa-solid fa-pen-nib"></i></span>
            <h2 class="font-title text-3xl font-bold text-sepia-900">
                {% if work %}Editar Obra{% else %}Escribir Nueva Obra{% endif %}
            </h2>
        </div>

        <form action="{% if work %}{{ url_for('edit_work', work_id=work.id) }}{% else %}{{ url_for('create_work') }}{% endif %}" method="POST" class="space-y-6">
            <div>
                <label for="title" class="block text-sm font-semibold text-sepia-800 mb-1">Título de la Obra</label>
                <input type="text" id="title" name="title" required value="{{ work.title if work else '' }}" placeholder="Ej. Nocturno en la Ventana"
                       class="w-full px-4 py-2.5 rounded-xl border border-sepia-300 focus:border-accent-wine focus:ring-2 focus:ring-accent-wine/20 focus:outline-none text-sm font-body">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="type" class="block text-sm font-semibold text-sepia-800 mb-1">Tipo de Texto</label>
                    <select id="type" name="type" required
                            class="w-full px-4 py-2.5 rounded-xl border border-sepia-300 focus:border-accent-wine focus:ring-2 focus:ring-accent-wine/20 focus:outline-none text-sm font-body bg-white">
                        <option value="poema" {% if work and work.type == 'poema' %}selected{% endif %}>Poema</option>
                        <option value="cuento" {% if work and work.type == 'cuento' %}selected{% endif %}>Cuento Corto</option>
                        <option value="reflexion" {% if work and work.type == 'reflexion' %}selected{% endif %}>Reflexión</option>
                    </select>
                </div>

                <div>
                    <label for="subtitle" class="block text-sm font-semibold text-sepia-800 mb-1">Subtítulo / Dedicatoria</label>
                    <input type="text" id="subtitle" name="subtitle" value="{{ work.subtitle if work else '' }}" placeholder="Ej. Versos a la lluvia tibia"
                           class="w-full px-4 py-2.5 rounded-xl border border-sepia-300 focus:border-accent-wine focus:ring-2 focus:ring-accent-wine/20 focus:outline-none text-sm font-body">
                </div>
            </div>

            <div>
                <label for="excerpt" class="block text-sm font-semibold text-sepia-800 mb-1">Extracto (Resumen corto)</label>
                <input type="text" id="excerpt" name="excerpt" value="{{ work.excerpt if work else '' }}" placeholder="Breve frase inicial para la tarjeta..."
                       class="w-full px-4 py-2.5 rounded-xl border border-sepia-300 focus:border-accent-wine focus:ring-2 focus:ring-accent-wine/20 focus:outline-none text-sm font-body">
            </div>

            <div>
                <label for="content" class="block text-sm font-semibold text-sepia-800 mb-1">Contenido Principal</label>
                <textarea id="content" name="content" rows="12" required placeholder="Escribe aquí los versos o párrafos..."
                          class="w-full px-4 py-3 rounded-xl border border-sepia-300 focus:border-accent-wine focus:ring-2 focus:ring-accent-wine/20 focus:outline-none text-sm font-body leading-relaxed">{{ work.content if work else '' }}</textarea>
            </div>

            <div class="flex items-center space-x-2">
                <input type="checkbox" id="featured" name="featured" {% if work and work.featured %}checked{% endif %} class="rounded border-sepia-300 text-accent-wine focus:ring-accent-wine">
                <label for="featured" class="text-sm font-medium text-sepia-800">Marcar como destacado</label>
            </div>

            <div class="flex justify-end space-x-4 pt-4 border-t border-sepia-100">
                <a href="{{ url_for('admin_dashboard') }}" class="px-5 py-2.5 rounded-xl border border-sepia-300 text-sepia-800 text-sm font-medium hover:bg-sepia-100 transition-colors">Cancelar</a>
                <button type="submit" class="px-6 py-2.5 bg-accent-wine hover:bg-sepia-900 text-white font-medium text-sm rounded-xl transition-colors shadow-sm">
                    {% if work %}Guardar Cambios{% else %}Publicar Texto{% endif %}
                </button>
            </div>
        </form>
    </div>
</main>
{% endblock %}
